<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />
  <meta name="theme-color" content="#0A0B0D" />
  <title>Pacte</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- Dynamic Island — live countdown of the most urgent task -->
  <div id="island" class="island" role="button" tabindex="0" aria-label="Tâche urgente">
    <span class="island-dot" aria-hidden="true"></span>
    <span class="island-title"></span>
    <span class="island-count"></span>
  </div>

  <main id="app" class="app">
    <!-- Home screen -->
    <section id="screen-home" class="screen">
      <header class="screen-head">
        <div>
          <p class="eyebrow">En jeu</p>
          <h1 class="stake" id="stake-total">—</h1>
        </div>
        <p class="screen-sub" id="home-sub">Glisse une carte pour la valider.</p>
      </header>
      <div id="cards" class="cards"></div>
      <p id="empty-state" class="empty hidden">Rien en jeu. Tout est réglé.</p>
    </section>

    <!-- Bilan screen -->
    <section id="screen-bilan" class="screen hidden">
      <header class="screen-head">
        <div>
          <p class="eyebrow">Bilan de la période</p>
          <h1 class="stake" id="bilan-total">—</h1>
        </div>
        <p class="screen-sub">Ce qui est resté, ce qui a été transféré.</p>
      </header>
      <div id="sankey" class="sankey"></div>
      <div id="bilan-legend" class="legend"></div>
    </section>
  </main>

  <!-- particle overlay for the dissolve effect -->
  <canvas id="fx" class="fx" aria-hidden="true"></canvas>

  <!-- Bottom navigation -->
  <nav class="nav" role="tablist" aria-label="Navigation">
    <button class="nav-item is-active" data-screen="home" role="tab" aria-selected="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="5.5" rx="2"/><rect x="4" y="13.5" width="16" height="5.5" rx="2"/></svg>
      <span>Tâches</span>
    </button>
    <button class="nav-item" data-screen="bilan" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h5c4 0 4 8 9 8" /><path d="M5 16h5" /></svg>
      <span>Bilan</span>
    </button>
  </nav>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
